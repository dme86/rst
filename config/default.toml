# rst default config. All keys are optional in user overrides.
# Copy to ~/.config/rst/config.toml (or $XDG_CONFIG_HOME/rst/config.toml).

[window]
columns = 96
rows = 28
# Small text inset; terminal applications' background colors still
# paint all the way to the window edges.
padding = 6

[font]
family = "0xProto Nerd Font"
size = 15.0
fallback = [
  "0xProto Nerd Font Mono",
  "JetBrainsMono Nerd Font",
  "Symbols Nerd Font Mono",
  "Menlo", "Monaco", "DejaVu Sans Mono",
]

[cursor]
style = "block"
blink = true
blink_interval_ms = 700

[scrollback]
lines = 10000

[terminal]
term = "xterm-256color"

[clipboard]
enabled = true
copy_on_select = false

[colors]
foreground = "#cdd6f4"
background = "#282828"
cursor = "#f5e0dc"
selection = "#45475a"
palette = [
  "#45475a", "#f38ba8", "#a6e3a1", "#f9e2af",
  "#89b4fa", "#f5c2e7", "#94e2d5", "#bac2de",
  "#585b70", "#f38ba8", "#a6e3a1", "#f9e2af",
  "#89b4fa", "#f5c2e7", "#94e2d5", "#a6adc8",
]
