name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Wayland build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - name: Test
        run: cargo test --locked --all-targets
      - name: Check
        run: cargo check --locked --all-targets
