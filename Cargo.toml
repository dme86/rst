[package]
name = "rst"
version = "0.1.0"
edition = "2021"
description = "A small native terminal emulator for macOS and Wayland"
license = "MIT"
repository = "https://github.com/dme86/rst"

[dependencies]
anyhow = "1"
base64 = "0.22"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
fontdb = "0.24"
fontdue = "0.9"
rustybuzz = "0.20.1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
softbuffer = { version = "0.4.6", default-features = false, features = ["wayland"] }
toml = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
vte = "0.15"
winit = { version = "0.30.13", default-features = false, features = ["wayland", "rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The same winit binary uses the native AppKit backend on macOS.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
