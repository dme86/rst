[package]
name = "rst"
version = "0.1.0"
edition = "2021"
description = "A small native terminal emulator for macOS and Wayland"
license = "MIT"
repository = "https://github.com/dme86/rst"

[dependencies]
anyhow = "1"
base64 = "0.22"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
fontdb = "0.24"
fontdue = "0.9"
rustybuzz = "0.20.1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
softbuffer = { version = "0.4.6", default-features = false, features = ["wayland"] }
toml = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
# A fixed OSC buffer prevents unterminated escape strings growing without limit.
vte = { version = "0.15", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["wayland", "rwh_06"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Use native AppKit to set the embedded README logo at runtime, including
# when rst is started via cargo run rather than via its .app bundle.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSArray", "NSValue"] }

objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "CAAnimation", "CAMediaTiming", "CATransaction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGColorSpace", "CGDataProvider", "CGImage"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGContext", "CGBitmapContext"] }
